<!doctype html>
<meta charset="utf-8"/>
<title>Motor Dev Diag</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 20px; }
  h1 { margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: 220px 1fr; gap: 8px 16px; align-items: center; }
  .badge { display:inline-block; padding: 2px 8px; border-radius: 999px; font-weight:600; }
  .ok { background:#16a34a22; color:#166534; border:1px solid #16a34a55; }
  .warn { background:#f59e0b22; color:#92400e; border:1px solid #f59e0b55; }
  .err { background:#dc262622; color:#7f1d1d; border:1px solid #dc262655; }
  .muted { color:#6b7280; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  iframe { width: 100%; height: 280px; border: 1px solid #e5e7eb; border-radius: 8px; }
  .note { color:#4b5563; font-size:12px; }
  .math-token--hovered { outline: 3px solid magenta !important; border-radius: 4px; }
</style>
<h1>Motor — Dev Diagnostics</h1>
<div class="grid" id="grid">
  <div>Anchors (KaTeX ids)</div><div id="a_anchors" class="mono">…</div>
  <div>Hover (.math-token--hovered)</div><div id="a_hover" class="mono">…</div>
  <div>Click (token select)</div><div id="a_click" class="mono muted">PENDING (after CC08)</div>
  <div>Brackets (pair select)</div><div id="a_brackets" class="mono muted">PENDING (after CC08)</div>
</div>
<p class="note">Страница открывает Playground снизу и запускает авто-проверки. Если что-то красное — смотри подробности в консоли.</p>
<iframe id="play" src="/?expr=2%2B3#graphs"></iframe>
<script type="module">
  const $ = (id) => document.getElementById(id);
  const badge = (ok, msg) => `<span class="badge ${ok===true?'ok':ok===false?'err':'warn'}">${msg}</span>`;

  const play = document.getElementById('play');
  play.addEventListener('load', async () => {
    const w = play.contentWindow, d = w.document;

    const waitFrame = () => new Promise((resolve) => w.requestAnimationFrame(resolve));
    const findRoot = () => d.querySelector('.katex .katex-html') || d.querySelector('.katex-html');

    try {
      // --- Wait for KaTeX render ---
      let root = findRoot();
      let attempts = 0;
      while (!root && attempts < 120) { // ~2s @ 60fps
        await waitFrame();
        root = findRoot();
        attempts += 1;
      }

      if (!root) {
        $('a_anchors').innerHTML = badge(false, 'FAIL (anchors not found yet — reload w/ cache disabled)');
        $('a_hover').innerHTML = badge(false, 'FAIL (tokens unavailable — anchors missing)');
        return;
      }

      // Inject dev CSS for hover highlighting inside iframe
      const style = d.createElement('style');
      style.textContent = '.math-token--hovered { outline: 3px solid magenta !important; border-radius: 4px; }';
      d.head.appendChild(style);

      // --- Anchors test ---
      const ids = [...root.querySelectorAll('[id]')];
      const okAnchors = ids.length >= 3;
      $('a_anchors').innerHTML = badge(okAnchors, okAnchors ? `OK (idCount=${ids.length})` : `FAIL (idCount=${ids.length} — need ≥3)`);

      // --- Hover test ---
      const target = ids[1] || ids[0];
      if (!target) {
        $('a_hover').innerHTML = badge(false, 'FAIL (no tokens found — inspect KaTeX output)');
        return;
      }

      const rect = target.getBoundingClientRect();
      const pointer = new w.PointerEvent('pointermove', {
        bubbles: true,
        clientX: rect.left + rect.width / 2,
        clientY: rect.top + rect.height / 2,
      });
      target.dispatchEvent(pointer);

      await waitFrame();

      const hovered = [...root.querySelectorAll('.math-token--hovered')];
      const okHover = hovered.length >= 1;
      $('a_hover').innerHTML = badge(okHover, okHover ? `OK (${hovered.map((n) => n.id).join(',')})` : 'FAIL (hover class not applied — check pointer listener)');
    } catch (e) {
      console.error('diag error:', e);
      $('a_anchors').innerHTML = badge(false, 'ERROR (see console)');
      $('a_hover').innerHTML = badge(false, 'ERROR (see console)');
    }
  });
</script>
