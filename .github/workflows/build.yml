name: build
on:
  push:
    branches: [ sandbox ]
  pull_request:
    branches: [ sandbox ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Let pnpm/action-setup read the version from package.json: "packageManager": "pnpm@x.y.z"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      # Build web package. Try by workspace name first, fallback to folder path.
      - name: Build web
        run: |
          pnpm --filter @motor/web build || pnpm -C packages/web build
