name: CI (sandbox)

on:
  push:
    branches: [sandbox]
  pull_request:
    branches: [sandbox]

permissions:
  contents: read

jobs:
  verify-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm -v
      - name: Install (frozen lockfile)
        run: pnpm -w install --frozen-lockfile
      - name: Generate aliases
        run: |
          node scripts/generate-aliases.mjs
          node scripts/generate-aliases.mjs --check
      - name: Verify
        run: pnpm verify
      - name: Test
        run: pnpm -r test
      - name: Token policy
        run: node scripts/forbidden-tokens.cjs
