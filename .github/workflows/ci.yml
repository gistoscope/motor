name: CI (sandbox)

on:
  push:
    branches: [sandbox]
  pull_request:
    branches: [sandbox]

permissions:
  contents: read

jobs:
  build-test:
    env:
      ROLLUP_SKIP_NODEJS_NATIVE: 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm -v

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Test
        run: pnpm -r test

      - name: Token policy
        run: node scripts/forbidden-tokens.cjs
