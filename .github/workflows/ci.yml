name: CI (sandbox)

on:
  push:
    branches: [sandbox]
  pull_request:
    branches: [sandbox]

permissions:
  contents: write

jobs:
  lockfile_sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
      - name: Enable Corepack & pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm -v
      - name: Ensure lockfile importers cover workspace
        id: importers
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ws = fs.readFileSync('pnpm-workspace.yaml','utf8').split(/\r?\n/);
          const pkgs = []; let inP = false;
          for (const l of ws) {
            if (!inP && l.trim() === 'packages:') { inP = true; continue; }
            if (inP) {
              if (/^\s*-\s+/.test(l)) pkgs.push(l.replace(/^\s*-\s+/, '').trim());
              else if (l.trim() && !l.startsWith(' ')) break;
            }
          }
          const lf = fs.readFileSync('pnpm-lock.yaml','utf8');
          const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const missing = pkgs.filter(p => !new RegExp(`\n  ${esc(p)}:`).test(lf));
          const out = `MISSING=${missing.join(',')}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, out + '\n');
          console.log(out);
          NODE
      - name: Regenerate lockfile when needed
        if: ${{ steps.importers.outputs.MISSING != '' }}
        run: pnpm -w install
      - name: Commit updated lockfile
        if: ${{ steps.importers.outputs.MISSING != '' }}
        run: |
          if git diff --quiet pnpm-lock.yaml; then
            echo "Lockfile unchanged"
          else
            git config user.name "lockfile-sync[bot]"
            git config user.email "lockfile-sync[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: sync pnpm-lock.yaml for workspace importers"
            git push
          fi

  verify_test:
    needs: lockfile_sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
      - name: Enable Corepack & pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm -v
      - name: Repo Guard (pre-install)
        run: node scripts/repo-guard.mjs
      - name: Install (frozen lockfile)
        run: pnpm -w install --frozen-lockfile
      - name: Verify
        run: pnpm -w verify
      - name: Test
        run: pnpm -w test
      - name: Token policy
        run: |
          if pnpm -w run | grep -q '^forbidden-tokens'; then pnpm -w run forbidden-tokens; fi
