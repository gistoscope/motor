name: CI (sandbox)

on:
  push:
    branches: [sandbox]
  pull_request:
    branches: [sandbox]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (reads .nvmrc) + cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Enable Corepack & activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm -v

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Test
        run: pnpm -r test

      - name: Token policy
        run: node scripts/forbidden-tokens.cjs
