name: CI (sandbox)

on:
  push:
    branches: [ sandbox ]
  pull_request:
    branches: [ sandbox ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - name: Enable Corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - name: Install deps
        run: pnpm install --frozen-lockfile=false
      - name: Run tests
        run: pnpm -r test
      - name: Token policy
        run: node scripts/forbidden-tokens.cjs
