name: TIL Workspace (TIL)

on:
  push:
    branches: [ "TIL" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - name: Install (frozen lockfile on TIL)
        run: pnpm install --frozen-lockfile
      - name: Build @til/*
        run: pnpm -w -F "@til/*" -r build
      - name: Test @til/*
        run: pnpm -w -F "@til/*" test
