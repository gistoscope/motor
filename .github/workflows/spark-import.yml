name: SPARK import (from ZIP)

on:
  workflow_dispatch:
    inputs:
      branch_from_sha:
        description: 'Baseline commit (A1)'
        default: e3aae3d8de8f05a389bfd3f98b080a65927f62c2
      new_branch:
        description: 'Target branch to create'
        default: spark
      zip_path:
        description: 'ZIP path (on base branch)'
        default: spark_sprint1.zip
      base_branch:
        description: 'Branch where ZIP lives'
        default: sandbox

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (to fetch ZIP)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_branch }}

      - name: Retrieve ZIP from base branch into /tmp
        run: |
          set -e
          if [ -f "${{ inputs.zip_path }}" ]; then
            cp "${{ inputs.zip_path }}" /tmp/spark.zip
          else
            git fetch origin ${{ inputs.base_branch }} --depth=1
            git show origin/${{ inputs.base_branch }}:${{ inputs.zip_path }} > /tmp/spark.zip
          fi
          ls -l /tmp/spark.zip

      - name: Create branch from baseline (A1)
        run: |
          git checkout --detach ${{ inputs.branch_from_sha }}
          git checkout -b "${{ inputs.new_branch }}"

      - name: Ensure unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Restore ZIP into working tree
        run: cp /tmp/spark.zip "${{ inputs.zip_path }}"

      - name: Unpack ZIP into repo root
        run: |
          unzip -o "${{ inputs.zip_path }}" -d .
          git rm -f "${{ inputs.zip_path }}" || true

      - name: Commit changes
        run: |
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "feat(spark): import @motor/spark Sprint 1 from ZIP" || echo "nothing to commit"

      - name: Push branch
        run: git push origin "${{ inputs.new_branch }}"

      - name: Open PR to base branch
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ inputs.base_branch }}
          branch: ${{ inputs.new_branch }}
          title: "feat(spark): add @motor/spark (Sprint 1)"
          body: "Auto-imported from `${{ inputs.zip_path }}` at `${{ inputs.branch_from_sha }}`."
          draft: false
