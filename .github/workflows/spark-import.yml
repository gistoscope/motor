name: SPARK — import package from zip (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sandbox
        uses: actions/checkout@v4
        with:
          ref: sandbox

      - name: Ensure unzip is available
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract spark_sprint1.zip into repo
        run: |
          test -f spark_sprint1.zip
          unzip -o spark_sprint1.zip
          test -d packages/spark

      - name: Commit extracted files
        run: |
          git config user.name  "spark-import-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/spark
          git commit -m "feat(spark): import @motor/spark headless kernel (Sprint 1)" || echo "nothing to commit"

      - name: Push to sandbox
        run: git push origin HEAD:sandbox
