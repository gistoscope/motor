name: SPARK import (from ZIP) v3

on:
  workflow_dispatch:
    inputs:
      branch_from_sha:
        description: 'Baseline commit (A1)'
        default: e3aae3d8de8f05a389bfd3f98b080a65927f62c2
      new_branch:
        description: 'Target branch to create'
        default: spark
      zip_path:
        description: 'ZIP file path relative to repo root'
        default: spark_sprint1.zip
      base_branch:
        description: 'Branch where ZIP lives'
        default: sandbox

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Download ZIP from base branch (raw)
        run: |
          set -e
          REPO="${GITHUB_REPOSITORY}"
          RAW_URL="https://raw.githubusercontent.com/${REPO}/${{ inputs.base_branch }}/${{ inputs.zip_path }}"
          echo "Fetching: $RAW_URL"
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "$RAW_URL" -o /tmp/spark.zip
          ls -l /tmp/spark.zip

      - name: Checkout repo (bare)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch from baseline
        run: |
          git checkout -b "${{ inputs.new_branch }}" ${{ inputs.branch_from_sha }}

      - name: Ensure unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unpack ZIP into repo root
        run: |
          unzip -o /tmp/spark.zip -d .
          # Если ZIP лежал в репозитории — не добавляем его в новый бранч
          git rm -f "${{ inputs.zip_path }}" || true
          git add -A

      - name: Commit changes
        run: |
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "feat(spark): import @motor/spark Sprint 1 (from ZIP on ${{ inputs.base_branch }})" \
              || echo "nothing to commit"

      - name: Push branch
        run: git push origin "${{ inputs.new_branch }}"

      - name: Open PR to base branch
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ inputs.base_branch }}
          branch: ${{ inputs.new_branch }}
          title: "feat(spark): add @motor/spark (Sprint 1)"
          body: "Imported from `${{ inputs.zip_path }}` on `${{ inputs.base_branch }}` at baseline `${{ inputs.branch_from_sha }}`."
          draft: false
