name: SPARK import (from ZIP) v4

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Baseline branch'
        default: 'sandbox'
        required: true
      zip_path:
        description: 'Path to ZIP in base branch'
        default: 'spark_sprint1.zip'
        required: true

# ДАЁМ ТОКЕНУ ПРАВА НА ЗАПИСЬ И PR (это убирает 403)
permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Verify & list ZIP
        run: |
          set -euxo pipefail
          test -f "${{ inputs.zip_path }}" || { echo "ZIP not found at ${{ inputs.zip_path }}"; ls -la; exit 1; }
          echo "ZIP found at ${{ inputs.zip_path }}"
          unzip -l "${{ inputs.zip_path }}" | sed -n '1,200p'

      - name: Prepare git user and spark branch
        run: |
          set -euxo pipefail
          git config user.name "spark-importer"
          git config user.email "spark@users.noreply.github.com"
          git checkout -B spark ${{ inputs.base_branch }}

      - name: Unpack ZIP and place into packages/spark
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/_unzipped"
          unzip -o "${{ inputs.zip_path }}" -d "$GITHUB_WORKSPACE/_unzipped" >/dev/null
          ROOT="$GITHUB_WORKSPACE/_unzipped"
          # Если в ZIP одна верхняя папка и нет файлов — заходим в неё
          if [ "$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && \
             [ "$(find "$ROOT" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
            ROOT="$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          fi
          echo "Detected content root: $ROOT"
          # Поддерживаем оба лэйаута: <root>/spark и <root>/packages/spark
          if [ -d "$ROOT/spark" ]; then
            SRC="$ROOT/spark"
          elif [ -d "$ROOT/packages/spark" ]; then
            SRC="$ROOT/packages/spark"
          else
            echo "spark package not found under $ROOT; tree follows:"
            find "$ROOT" -maxdepth 3 -print
            exit 1
          fi
          mkdir -p packages/spark
          rsync -a --delete "$SRC/" "packages/spark/"

      # ВАЖНО: убрали ручной push — дальше всё сделает create-pull-request
      - name: Create PR (auto-commit & push)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(spark): import from ZIP'
          title: 'feat: bootstrap @motor/spark (imported from ZIP)'
          body: 'Automated import of SPARK package.'
          branch: spark
          base: ${{ inputs.base_branch }}
          draft: false
